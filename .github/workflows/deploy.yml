name: Deploy Exam Application

on:
  push:
    branches:
      - main

env:
  PROJECT_ID: my-project-2-507717
  REGION: us-central1
  REPOSITORY: exam-repo

  BACKEND_SERVICE: exam-backend
  FRONTEND_SERVICE: exam-frontend

  BACKEND_IMAGE: us-central1-docker.pkg.dev/my-project-2-507717/exam-repo/backend:v1
  FRONTEND_IMAGE: us-central1-docker.pkg.dev/my-project-2-507717/exam-repo/frontend

  CLOUD_SQL_INSTANCE: my-project-2-507717:us-central1:free-trial-first-project

jobs:

  deploy-backend:

    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: github-deployer@my-project-2-507717.iam.gserviceaccount.com

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: |
          gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build backend image
        run: |
          docker build \
            -t $BACKEND_IMAGE:${{ github.sha }} \
            ./backend

      - name: Push backend image
        run: |
          docker push $BACKEND_IMAGE:${{ github.sha }}

      - name: Deploy backend
        run: |
          gcloud run deploy $BACKEND_SERVICE \
            --image=$BACKEND_IMAGE:${{ github.sha }} \
            --region=$REGION \
            --platform=managed \
            --port=8000 \
            --service-account=exam-backend@my-project-2-507717.iam.gserviceaccount.com \
            --add-cloudsql-instances=$CLOUD_SQL_INSTANCE \
            --set-secrets="DATABASE_URL=database-url:latest,SECRET_KEY=secret-key:latest" \
            --set-env-vars="ACCESS_TOKEN_EXPIRE_MINUTES=1440,CORS_ORIGINS=*" \
            --allow-unauthenticated

      - name: Get backend URL
        id: backend-url
        run: |
          URL=$(gcloud run services describe $BACKEND_SERVICE \
            --region=$REGION \
            --format='value(status.url)')

          echo "url=$URL" >> "$GITHUB_OUTPUT"

    outputs:
      backend_url: ${{ steps.backend-url.outputs.url }}


  deploy-frontend:

    needs: deploy-backend

    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: github-deployer@my-project-2-507717.iam.gserviceaccount.com

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: |
          gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Configure frontend backend URL
        env:
          BACKEND_URL: ${{ needs.deploy-backend.outputs.backend_url }}
        run: |
          sed -i \
            "s|\${BACKEND_URL}|$BACKEND_URL|g" \
            frontend/nginx-cloudrun.conf

      - name: Build frontend image
        run: |
          docker build \
            -f frontend/Dockerfile.cloudrun \
            -t $FRONTEND_IMAGE:${{ github.sha }} \
            ./frontend

      - name: Push frontend image
        run: |
          docker push $FRONTEND_IMAGE:${{ github.sha }}

      - name: Deploy frontend
        run: |
          gcloud run deploy $FRONTEND_SERVICE \
            --image=$FRONTEND_IMAGE:${{ github.sha }} \
            --region=$REGION \
            --platform=managed \
            --port=80 \
            --allow-unauthenticated